<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Hospitals</title>
   <style>
      body {
         background: #111827;
         font-family: Arial;
         color: white;
         padding: 20px;
      }

      h1 {
         text-align: center;
      }

      .card {
         background: white;
         color: black;
         padding: 20px;
         border-radius: 20px;
         margin-top: 20px;
      }

      .btn {
         background: red;
         color: white;
         border: none;
         padding: 10px 20px;
         border-radius: 10px;
         margin-top: 10px;
      }
      @media(max-width:768px){

   body{
      padding:15px;
   }

   h1{
      font-size:32px;
      text-align:center;
   }

   .card{
      padding:18px;
      border-radius:18px;
   }

   .card h2{
      font-size:22px;
      word-wrap:break-word;
   }

   .card p{
      font-size:15px;
   }

   .btn{
      width:100%;
      padding:12px;
      font-size:16px;
   }

}

    .contact-box {
      background: white;
      color: black;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      margin-top: 30px;
    }

    .contact-box h1 {
      font-size: 60px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .contact-box p {
      font-size: 18px;
    }
    .chatbot-btn{

  position:fixed;

  bottom:95px;

  right:20px;

  width:65px;

  height:65px;

  border-radius:50%;

  background:#ef4444;

  color:white;

  display:flex;

  justify-content:center;

  align-items:center;

  font-size:30px;

  box-shadow:0 10px 20px rgba(0,0,0,0.2);

  cursor:pointer;

  z-index:1000;
}

.chatbot-btn:hover{
  transform:scale(1.08);
}
   </style>

</head>

<body>

   <h1>🏥 Hospitals</h1>

   <div class="card">
      <h2>BMHRC Hospital</h2>
      <p>Super Speciality Trauma Centre</p>
      <button class="btn">Call</button>
   </div>

   <div class="card">
      <h2>People's Hospital</h2>
      <p>Multi-speciality Hospital</p>
      <button class="btn">Call</button>
   </div>

   <div class="card">
      <h2>Jeevandan Hospital</h2>
      <p>Emergency Care Hospital</p>
      <button class="btn">Call</button>
   </div>
   <div class="card">
      <a href="roadsos.html">

         <button class="btn">
            Back to Home
         </button>
         </a>
   </div>
   <!-- Chatbot Button -->

<div class="chatbot-btn">

  💬

</div>
</body>

</html>
